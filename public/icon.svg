<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer aura -->
  <circle cx="256" cy="256" r="180" fill="url(#globeGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Orbital Ring -->
  <ellipse cx="256" cy="256" rx="190" ry="70" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="16 10" transform="rotate(-25 256 256)" opacity="0.7"/>

  <!-- Core Globe -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#globeGrad)" stroke-width="10"/>

  <!-- Globe Longitude & Latitude Lines -->
  <!-- Equator -->
  <line x1="116" y1="256" x2="396" y2="256" stroke="url(#globeGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- Latitude upper -->
  <ellipse cx="256" cy="190" rx="115" ry="32" fill="none" stroke="url(#globeGrad)" stroke-width="5" opacity="0.6"/>
  <!-- Latitude lower -->
  <ellipse cx="256" cy="322" rx="115" ry="32" fill="none" stroke="url(#globeGrad)" stroke-width="5" opacity="0.6"/>
  <!-- Central Meridian -->
  <ellipse cx="256" cy="256" rx="65" ry="140" fill="none" stroke="url(#globeGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Cultural Sparkle & Play Triangle in Center -->
  <circle cx="256" cy="256" r="48" fill="#f59e0b" filter="url(#glow)"/>
  <polygon points="244,236 244,276 278,256" fill="#020617"/>

  <!-- Top-right cultural star -->
  <path d="M 380 130 Q 380 150 400 150 Q 380 150 380 170 Q 380 150 360 150 Q 380 150 380 130 Z" fill="#fbbf24"/>
  <!-- Bottom-left cultural star -->
  <path d="M 130 370 Q 130 385 145 385 Q 130 385 130 400 Q 130 385 115 385 Q 130 385 130 370 Z" fill="#f43f5e"/>
</svg>
